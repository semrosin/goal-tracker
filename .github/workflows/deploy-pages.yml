name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Read the Pages configuration so the app is built for the exact base
      # path GitHub serves it from. base_path is "/<repository>" for project
      # sites and "" when a custom domain serves the site from the root, so
      # both cases work without any extra setup.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Set the repository variable PAGES_PUBLIC_PATH (for example "/") to
      # override the detected base path.
      - name: Compute the site base path
        run: |
          if [ -n "${{ vars.PAGES_PUBLIC_PATH }}" ]; then
            base_path="${{ vars.PAGES_PUBLIC_PATH }}"
          else
            base_path="${{ steps.pages.outputs.base_path }}"
          fi
          # Collapse leading/trailing slashes so the result is always "/" or
          # "/<base>/". Blindly appending "/" turned an override of "/" into
          # "//", which emitted protocol-relative asset URLs (//static/js/...)
          # that browsers try to load from a host called "static".
          base_path="$(printf '%s' "$base_path" | sed -e 's#^/*##' -e 's#/*$##')"
          if [ -z "$base_path" ]; then
            public_path="/"
          else
            public_path="/${base_path}/"
          fi
          echo "PUBLIC_PATH=${public_path}" >> "$GITHUB_ENV"
          echo "Site base path: ${public_path}"

      # The Supabase URL and publishable key are public values that end up in
      # the browser bundle. Keep them as repository variables (or secrets).
      - name: Build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      # GitHub Pages has no SPA rewrites, so deep links such as
      # /auth/callback are served from 404.html with the same bundle.
      # .nojekyll keeps GitHub from filtering files that start with "_".
      - name: Prepare the SPA fallback
        run: |
          cp build/index.html build/404.html
          touch build/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
